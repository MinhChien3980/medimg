# Server block for the SPA image (installed as /etc/nginx/conf.d/default.conf, i.e. inside `http {}`).
# Serves dist/ and proxies the API and object storage, so the browser only ever talks to one origin.

# Hashed bundles never change; index.html must be revalidated so a deploy is picked up at once.
# Proxied responses keep the upstream's own Cache-Control (an empty value adds no header).
map $uri $static_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/(api|medimg)/    "";
    default             "no-cache";
}

# Keep the scheme a TLS-terminating proxy in front of this container reports; fall back to ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The browser's port, taken from its Host header. Without it Tomcat's RemoteIpValve assumes 80/443
# once X-Forwarded-Proto is set. An empty value means the scheme's default port (header not sent).
map $http_host $forwarded_port {
    ~:(?<port>[0-9]+)$ $port;
    default            "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Upstreams are resolved per request through Docker's embedded DNS, so Nginx starts even when
    # they are not up yet (or not resolvable at all) and follows their IP across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_service http://core-service:8080;
    set $object_storage http://seaweedfs:8333;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $static_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ant Design injects its CSS-in-JS as <style> tags (hence 'unsafe-inline' for styles only);
    # the canvas viewer draws images from blob: and data: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # A missing chunk must be a 404, not index.html served as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # core-service REST API. With a variable in proxy_pass the original request URI is forwarded.
    # Host, X-Forwarded-Proto and X-Forwarded-Port carry the browser's origin, so core-service sees
    # the same origin as the page; otherwise every browser POST is rejected as cross-origin.
    location /api/ {
        proxy_pass $core_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_hide_header X-Content-Type-Options;
    }

    # Live AI progress (SSE): stream events as they come and keep idle connections open
    # (the server sends a heartbeat every 15 s).
    location ~ ^/api/v1/predictions/[^/]+/events$ {
        proxy_pass $core_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SeaweedFS S3 (presigned GET / PUT). The URLs are SigV4-signed for the public host and port
    # the browser uses, and SigV4 covers the Host header, so it is passed through unchanged.
    # Uploads are capped by core-service (2D 50 MB, CT volume 500 MB); the body limit leaves room
    # for the largest. Objects such as volume.nii.gz are served as stored (gzip is not in
    # gzip_types), which the NIfTI loader relies on: it gunzips the bytes itself.
    location /medimg/ {
        proxy_pass $object_storage;
        proxy_set_header Host $http_host;
        client_max_body_size 510m;
        proxy_request_buffering off;
    }
}
