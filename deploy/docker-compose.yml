# Local stack.
#   docker compose -f deploy/docker-compose.yml up -d                     → infra + ai-worker + ingest-worker (core-service and frontend run on the host)
#   docker compose -f deploy/docker-compose.yml --profile full up --build → everything, UI on http://localhost:8088
name: medimg

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medimg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MEDIMG_OWNER_PASSWORD: ${MEDIMG_OWNER_PASSWORD:-medimg_owner}
      MEDIMG_APP_PASSWORD: ${MEDIMG_APP_PASSWORD:-medimg_app}
    # random_page_cost 1.1: data on SSD, where an index lookup costs little more than a sequential read.
    command: ["postgres", "-c", "shared_buffers=384MB", "-c", "random_page_cost=1.1"]
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medimg"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 1536m } } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  # S3-compatible object storage (replaces MinIO, whose community edition is no longer published).
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports: ["${S3_PORT:-8333}:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    deploy: { resources: { limits: { memory: 512m } } }

  # One image, two roles (WORKER_ROLE): model inference (ai.jobs.cpu) and CT ingest (imaging.jobs).
  ai-worker:
    build: ../ai/inference
    image: medimg-ai-worker:dev
    environment: &worker-env
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: medimg
      S3_SECRET_KEY: ${S3_SECRET_KEY:-medimg-dev-secret}
      WORKER_ROLE: ai
      WORKER_KIND: cpu
      OMP_NUM_THREADS: "3"
    depends_on: &worker-deps
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    restart: unless-stopped
    # Measured peak with TotalSegmentator --fast on CPU: 5.1 GB for a 47 x 47 x 65 cm field of
    # view (larger ones are refused, see SEG_MAX_GRID_VOXELS), ~3 min; a torso takes 35-80 s.
    deploy: { resources: { limits: { memory: 6g, cpus: "3.0" } } }

  ingest-worker:
    build: ../ai/inference
    image: medimg-ai-worker:dev
    environment:
      <<: *worker-env
      WORKER_ROLE: ingest
      OMP_NUM_THREADS: "2"
    depends_on: *worker-deps
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Measured peaks: 0.2 GB for a 42 M-voxel CT, 0.67 GB for a 293 M-voxel ZIP of PNG slices
    # (just under the 300 M-voxel limit), 0.53 GB for a 49-megapixel DICOM radiograph (limit 50).
    # The 2 GB cap leaves room for the DICOM series path, which holds two int16 copies.
    deploy: { resources: { limits: { memory: 2g, cpus: "2.0" } } }

  core-service:
    profiles: ["full"]
    build: ../backend/core-service
    image: medimg-core-service:dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/medimg
      REDIS_HOST: redis
      S3_ENDPOINT: http://seaweedfs:8333
      # Presigned URLs are signed for the host the browser uses: the web container below.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${WEB_PORT:-8088}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-medimg-dev-secret}
      JAVA_TOOL_OPTIONS: -Xmx1536m
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5
    deploy: { resources: { limits: { memory: 2g } } }

  # React SPA served by Nginx, which also proxies /api/ to core-service and /medimg/ to SeaweedFS.
  web:
    profiles: ["full"]
    build: ../frontend
    image: medimg-web:dev
    ports: ["${WEB_PORT:-8088}:8080"]
    depends_on:
      core-service: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    deploy: { resources: { limits: { memory: 128m } } }

volumes:
  pgdata:
  redisdata:
  s3data:
