[project]
name = "medimg-ai-worker"
version = "0.1.0"
description = "AI inference worker for the medical imaging platform (Redis Streams consumer)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# torch/torchvision are installed from the PyTorch CPU index in the Dockerfile
# (https://download.pytorch.org/whl/cpu); the pins below must stay in sync with it.
dependencies = [
    "redis~=8.2.0",
    "boto3~=1.44.10",
    "numpy~=2.5.5",
    "pillow~=13.0.0",
    "pydantic-settings~=2.16.3",
    "torch==2.14.1",
    "torchvision==0.29.2",
    "torchxrayvision==1.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "fakeredis~=2.41.0",
    "moto[s3]~=5.2.6",
    "ruff~=0.17.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the real TorchXRayVision model (needs pre-downloaded weights)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
