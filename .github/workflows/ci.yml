name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pushes to main and dev run every job, including the real-model tests. Pull requests and
  # pushes to other branches run only the jobs whose area changed (compared with dev).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      backend: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.backend == 'true' }}
      ai-worker: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.ai-worker == 'true' }}
      frontend: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.frontend == 'true' }}
      tools: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.tools == 'true' }}
    steps:
      - id: scope
        run: echo "full=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}" >> "$GITHUB_OUTPUT"
      # On a push, paths-filter diffs against dev with git, so it needs the history.
      - uses: actions/checkout@v7
        if: steps.scope.outputs.full != 'true' && github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.scope.outputs.full != 'true'
        with:
          base: dev
          filters: |
            backend:
              - backend/core-service/**
              - .github/workflows/ci.yml
            ai-worker:
              - ai/inference/**
              - .github/workflows/ci.yml
            frontend:
              - frontend/**
              - .github/workflows/ci.yml
            tools:
              - tools/**
              - .github/workflows/ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test (unit, ArchUnit, Testcontainers integration)
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/core-service/build/reports/tests
            backend/core-service/build/reports/jacoco

  ai-worker:
    needs: changes
    if: needs.changes.outputs.ai-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      # The image is ~4 GB (PyTorch CPU, TotalSegmentator + nnU-Net, model weights); building and
      # loading it needs more than the runner's default free disk space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ai/inference
          target: test
          tags: medimg-ai-worker:test
          load: true
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,scope=ai-worker,mode=max
      - name: Lint and fast tests
        if: needs.changes.outputs.full != 'true'
        run: docker run --rm medimg-ai-worker:test sh -c "ruff check . && ruff format --check . && python -m pytest -q -m 'not slow'"
      - name: Lint and all tests, including the real models
        if: needs.changes.outputs.full == 'true'
        run: docker run --rm medimg-ai-worker:test sh -c "ruff check . && ruff format --check . && python -m pytest -q"

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx run ruff==0.17.6 check . && pipx run ruff==0.17.6 format --check .
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
